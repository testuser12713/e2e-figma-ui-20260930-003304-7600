<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>businesshandler — Add Expense</title>
<link rel="stylesheet" href="styles.css">
<style>
  .add-head { display: flex; align-items: center; gap: 14px; padding: 12px 40px; }
  .add-title { font-family: var(--font-heading); font-weight: 700; font-size: 24px; line-height: 29px; color: var(--color-fg); }
  .add-form { display: flex; flex-direction: column; align-items: center; margin-top: 58px; }
  .field + .field { margin-top: 20px; }
  .field .field-icon svg { display: block; }
  .add-btn { margin-top: 40px; }
</style>
</head>
<body>
<div class="screen" data-od-id="add-expense-screen">
  <div class="statusbar">
    <span class="sb-time">9:41</span>
    <span class="sb-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.6"/><rect x="4.6" y="5" width="3" height="6" rx="0.6"/><rect x="9.2" y="2.5" width="3" height="8.5" rx="0.6"/><rect x="13.8" y="0" width="3" height="11" rx="0.6"/></svg>
      <svg width="25" height="11" viewBox="0 0 25 11" fill="none"><rect x="0.5" y="0.5" width="21" height="10" rx="2.6" stroke="currentColor" opacity="0.45"/><rect x="2" y="2" width="16" height="7" rx="1.3" fill="currentColor"/><path d="M22.6 3.4v4.2a1.8 1.8 0 0 0 0-4.2Z" fill="currentColor"/></svg>
    </span>
  </div>

  <div class="scroll no-tab">
    <header class="add-head" data-od-id="add-expense-header">
      <a class="btn-back-dark" href="money.html" aria-label="Back" data-od-id="add-back">
        <svg width="11" height="18" viewBox="0 0 11 18" fill="none"><path d="M9.5 1L2 9l7.5 8" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="add-title">Add Expense</div>
    </header>

    <form class="add-form" onsubmit="location.href='money.html'; return false;" data-od-id="add-expense-form">
      <div class="field" data-od-id="add-field-name">
        <span class="field-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="1.8"><path d="M4 20h16"/><path d="M5 20V6h14v14"/><path d="M9 10h6M9 14h6"/></svg></span>
        <input type="text" placeholder="Description">
      </div>
      <div class="field" data-od-id="add-field-amount">
        <span class="field-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="1.8"><path d="M12 3v18M7 7l5-4 5 4M7 17l5 4 5-4"/></svg></span>
        <input type="text" inputmode="decimal" placeholder="0.00 &euro;">
      </div>
      <div class="field" data-od-id="add-field-category">
        <span class="field-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="1.8"><path d="M4 4h2l2 10h9l2-7H8"/><circle cx="9" cy="18" r="1.5"/><circle cx="17" cy="18" r="1.5"/></svg></span>
        <select aria-label="Category">
          <option value="" disabled selected>Category</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Health</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field" data-od-id="add-field-date">
        <span class="field-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg></span>
        <input type="text" placeholder="14 March 2026">
      </div>
      <button type="submit" class="btn-green add-btn" data-od-id="add-expense-submit">Add Expense</button>
    </form>
  </div>
</div>
</body>
</html>
