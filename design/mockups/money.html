<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>businesshandler — Money Management</title>
<link rel="stylesheet" href="styles.css">
<style>
  .m-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 4px 26px 0 14px; }
  .m-balance { padding: 14px 40px 0 49px; }
  .m-balance .amount { margin-top: 4px; }

  .qcard { margin: 30px 39px 0 45px; padding: 20px 20px 22px; border-radius: 20px; background: #fff; }
  .qcard .title { text-align: center; margin-bottom: 18px; }
  .qgrid { display: grid; grid-template-columns: repeat(3, 55px); justify-content: space-between; row-gap: 20px; }
  .qtile { width: 55px; height: 55px; background: #fff; border: 1px dashed #000; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .qtile.square { border-radius: 0; }

  .tx-title { margin: 30px 39px 0 45px; }
  .tx-list { margin: 14px 39px 0 28px; }
  .tx-row { display: flex; align-items: center; height: 83px; }
  .tx-ill { width: 53px; height: 53px; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
  .tx-col { flex: 1; margin-left: 16px; }
  .tx-cat { font-family: var(--font-body); font-weight: 100; font-size: 9px; line-height: 11px; letter-spacing: 1.8px; text-transform: uppercase; color: #000; }
  .tx-desc { margin-top: 4px; font-family: var(--font-body); font-weight: 100; font-size: 12px; line-height: 15px; color: #000; }
  .tx-date { margin-top: 5px; font-family: var(--font-body); font-weight: 100; font-size: 9px; line-height: 11px; text-transform: uppercase; color: #000; opacity: 0.7; }
  .tx-amt { font-family: var(--font-body); font-weight: 100; font-size: 14px; line-height: 18px; color: #000; }
</style>
</head>
<body>
<div class="screen" data-od-id="money-screen">
  <div class="statusbar">
    <span class="sb-time">9:41</span>
    <span class="sb-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.6"/><rect x="4.6" y="5" width="3" height="6" rx="0.6"/><rect x="9.2" y="2.5" width="3" height="8.5" rx="0.6"/><rect x="13.8" y="0" width="3" height="11" rx="0.6"/></svg>
      <svg width="25" height="11" viewBox="0 0 25 11" fill="none"><rect x="0.5" y="0.5" width="21" height="10" rx="2.6" stroke="currentColor" opacity="0.45"/><rect x="2" y="2" width="16" height="7" rx="1.3" fill="currentColor"/><path d="M22.6 3.4v4.2a1.8 1.8 0 0 0 0-4.2Z" fill="currentColor"/></svg>
    </span>
  </div>

  <div class="scroll">
    <header class="m-head" data-od-id="money-header">
      <a class="icon-back" href="dashboard.html" aria-label="Back" data-od-id="money-back">
        <svg viewBox="0 0 11 18" fill="none"><path d="M9.5 1L2 9l7.5 8" stroke="#181461" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="avatar" data-od-id="money-avatar">A</div>
    </header>

    <div class="m-balance" data-od-id="money-balance">
      <div class="label-12">Monthly Expenses</div>
      <div class="amount" data-od-id="money-amount">1,345.00&euro;</div>
    </div>

    <div class="qcard" data-od-id="money-quick-categories">
      <div class="title label-12">Quick Categories</div>
      <div class="qgrid">
        <a class="qtile" href="money-add.html" data-od-id="cat-food">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6"><path d="M4 4h2l2 10h9l2-7H8"/><circle cx="9" cy="18" r="1.5"/><circle cx="17" cy="18" r="1.5"/></svg>
        </a>
        <a class="qtile" href="money-add.html" data-od-id="cat-transport">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6"><path d="M4 16l1.5-5h13L20 16"/><rect x="4" y="16" width="16" height="4" rx="1.5"/><circle cx="8" cy="20" r="1.4"/><circle cx="16" cy="20" r="1.4"/></svg>
        </a>
        <a class="qtile" href="money-add.html" data-od-id="cat-shopping">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6"><path d="M6 7h12l1 13H5L6 7Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg>
        </a>
        <a class="qtile square" href="money-add.html" data-od-id="cat-bills">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
        </a>
        <a class="qtile square" href="money-add.html" data-od-id="cat-health">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6"><path d="M12 20s-7-4.4-7-9.5A4 4 0 0 1 12 8a4 4 0 0 1 7 2.5C19 15.6 12 20 12 20Z"/></svg>
        </a>
        <a class="qtile square" href="money-add.html" data-od-id="cat-other">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
        </a>
      </div>
    </div>

    <div class="tx-title label-12" data-od-id="money-tx-title">Recent Transactions</div>

    <div class="tx-list" data-od-id="money-tx-list">
      <div class="tx-row" data-od-id="tx-row-salary">
        <div class="tx-ill" style="background:#ECF1FA"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#179F2F" stroke-width="1.8"><path d="M12 3v18M7 7l5-4 5 4M7 17l5 4 5-4"/></svg></div>
        <div class="tx-col"><div class="tx-cat">Income</div><div class="tx-desc">Monthly payroll deposit</div><div class="tx-date">10 Mar</div></div>
        <div class="tx-amt">+2,450.00&euro;</div>
      </div>
      <div class="tx-row" data-od-id="tx-row-groceries">
        <div class="tx-ill" style="background:#ECF1FA"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="1.8"><path d="M4 4h2l2 10h9l2-7H8"/><circle cx="9" cy="18" r="1.5"/><circle cx="17" cy="18" r="1.5"/></svg></div>
        <div class="tx-col"><div class="tx-cat">Groceries</div><div class="tx-desc">Weekly supermarket run</div><div class="tx-date">12 Mar</div></div>
        <div class="tx-amt">-48.20&euro;</div>
      </div>
      <div class="tx-row" data-od-id="tx-row-rent">
        <div class="tx-ill" style="background:#ECF1FA"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="1.8"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V21h14V9.5"/></svg></div>
        <div class="tx-col"><div class="tx-cat">Housing</div><div class="tx-desc">Apartment rent</div><div class="tx-date">01 Mar</div></div>
        <div class="tx-amt">-890.00&euro;</div>
      </div>
      <div class="tx-row" data-od-id="tx-row-coffee">
        <div class="tx-ill" style="background:#ECF1FA"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="1.8"><path d="M5 9h11v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V9Z"/><path d="M16 10h2a2.5 2.5 0 0 1 0 5h-2"/></svg></div>
        <div class="tx-col"><div class="tx-cat">Food</div><div class="tx-desc">Caf&eacute; coffee</div><div class="tx-date">11 Mar</div></div>
        <div class="tx-amt">-4.50&euro;</div>
      </div>
    </div>
  </div>

  <nav class="tabbar" data-od-id="tabbar">
    <div class="tabs-side">
      <a class="tab" href="dashboard.html" data-od-id="tab-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V21h14V9.5"/></svg>
        <span>Home</span>
      </a>
      <a class="tab active" href="money.html" data-od-id="tab-money">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.4"/><path d="M6 10.5v3M18 10.5v3"/></svg>
        <span>Money</span>
      </a>
    </div>
    <div class="fab-slot"></div>
    <div class="tabs-side">
      <a class="tab" href="time.html" data-od-id="tab-time">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>Time</span>
      </a>
      <a class="tab" href="time.html" data-od-id="tab-today">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
        <span>Today</span>
      </a>
    </div>
    <a class="fab" href="money-add.html" aria-label="Add" data-od-id="fab">
      <svg viewBox="0 0 20 20" width="20" height="20"><path d="M10 0V20M0 10H20" stroke="#fff" stroke-width="3"/></svg>
    </a>
  </nav>
</div>
</body>
</html>
