<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>businesshandler — Onboarding</title>
<link rel="stylesheet" href="styles.css">
<style>
  .ob { position: relative; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .ob-slide { display: none; flex-direction: column; align-items: center; flex: 1; padding-top: 40px; }
  .ob-slide.active { display: flex; }
  .ob-art { width: 230px; height: 230px; display: flex; align-items: center; justify-content: center; }
  .ob-head { margin-top: 18px; font-family: var(--font-heading); font-weight: 700; font-size: 25px; line-height: 32px; color: var(--color-fg); text-align: center; padding: 0 45px; }
  .ob-head.green { color: var(--color-accent); }
  .ob-body { margin-top: 12px; font-family: var(--font-body); font-weight: 400; font-size: 10px; line-height: 13px; color: var(--color-muted); text-align: center; padding: 0 60px; }
  .ob-dots { margin-top: 30px; display: flex; gap: 21px; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--color-muted-dot); transform: scale(0.8); transition: transform .2s ease, background .2s ease; }
  .dot.active { background: var(--color-accent-light); transform: scale(1); }
  .ob-footer {
    flex: 0 0 174px;
    background: linear-gradient(180deg, #61D27C 0%, #6CC57C 100%);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 42px 0 42px;
  }
  .ob-footer .skip { font-family: var(--font-body); font-weight: 500; font-size: 15px; line-height: 19px; color: #fff; cursor: pointer; }
  .ob-footer .next { font-family: var(--font-body); font-weight: 500; font-size: 15px; line-height: 19px; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<div class="screen" data-od-id="onboarding-screen">
  <div class="statusbar">
    <span class="sb-time">9:41</span>
    <span class="sb-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.6"/><rect x="4.6" y="5" width="3" height="6" rx="0.6"/><rect x="9.2" y="2.5" width="3" height="8.5" rx="0.6"/><rect x="13.8" y="0" width="3" height="11" rx="0.6"/></svg>
      <svg width="25" height="11" viewBox="0 0 25 11" fill="none"><rect x="0.5" y="0.5" width="21" height="10" rx="2.6" stroke="currentColor" opacity="0.45"/><rect x="2" y="2" width="16" height="7" rx="1.3" fill="currentColor"/><path d="M22.6 3.4v4.2a1.8 1.8 0 0 0 0-4.2Z" fill="currentColor"/></svg>
    </span>
  </div>

  <div class="ob" id="ob">
    <div class="ob-slide active" data-od-id="onboarding-slide-1">
      <div class="ob-art">
        <svg width="230" height="230" viewBox="0 0 230 230" fill="none">
          <rect x="30" y="42" width="170" height="150" rx="22" fill="#FFFFFF" stroke="#6CC57C" stroke-width="3"/>
          <rect x="30" y="42" width="170" height="52" rx="22" fill="#6CC57C"/>
          <rect x="30" y="70" width="170" height="24" fill="#6CC57C"/>
          <rect x="58" y="118" width="58" height="40" rx="8" fill="#ECF1FA"/>
          <path d="M66 130h42M66 142h28" stroke="#179F2F" stroke-width="4" stroke-linecap="round"/>
          <circle cx="150" cy="128" r="15" fill="#61D27C"/>
          <path d="M150 120v16M142 128h16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <circle cx="150" cy="166" r="15" fill="#DCE5F4"/>
          <path d="M150 158v16M142 166h16" stroke="#179F2F" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="ob-head" data-od-id="onboarding-head-1">Manage your money easily</div>
      <div class="ob-body">Track income, expenses and balances in one calm place. Built for small business owners.</div>
      <div class="ob-dots"><span class="dot active"></span><span class="dot"></span></div>
    </div>

    <div class="ob-slide" data-od-id="onboarding-slide-2">
      <div class="ob-art">
        <svg width="230" height="230" viewBox="0 0 230 230" fill="none">
          <rect x="42" y="58" width="146" height="130" rx="20" fill="#FFFFFF" stroke="#6CC57C" stroke-width="3"/>
          <rect x="66" y="84" width="40" height="8" rx="4" fill="#DCE5F4"/>
          <rect x="66" y="102" width="24" height="8" rx="4" fill="#ECF1FA"/>
          <path d="M132 82v82" stroke="#ECF1FA" stroke-width="2"/>
          <path d="M66 122h60M66 140h60" stroke="#ECF1FA" stroke-width="2"/>
          <path d="M150 132h-14v16" stroke="#179F2F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M150 132h16" stroke="#179F2F" stroke-width="4" stroke-linecap="round"/>
          <circle cx="160" cy="60" r="22" fill="#6CC57C"/>
          <path d="M160 50v20M150 60h20" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="ob-head green" data-od-id="onboarding-head-2">See every number at a glance</div>
      <div class="ob-body">A weekly report, quick categories and a clean transaction list keep you in control.</div>
      <div class="ob-dots"><span class="dot"></span><span class="dot active"></span></div>
    </div>
  </div>

  <div class="ob-footer" data-od-id="onboarding-footer">
    <span class="skip" id="ob-skip">Skip</span>
    <span class="next" id="ob-next">Next</span>
  </div>
</div>

<script>
  var slides = document.querySelectorAll('.ob-slide');
  var dots = document.querySelectorAll('.dot');
  var idx = 0;
  function show(n) {
    idx = n;
    slides.forEach(function (s, i) { s.classList.toggle('active', i === n); });
    dots.forEach(function (d, i) { d.classList.toggle('active', i === n); });
  }
  document.getElementById('ob-skip').addEventListener('click', function () { location.href = 'index.html'; });
  document.getElementById('ob-next').addEventListener('click', function () {
    if (idx === 0) { show(1); } else { location.href = 'index.html'; }
  });
</script>
</body>
</html>
