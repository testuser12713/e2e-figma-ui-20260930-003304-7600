<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>businesshandler — Time Management</title>
<link rel="stylesheet" href="styles.css">
<style>
  .t-head {
    display: flex; align-items: center; gap: 14px;
    background: #fff; box-shadow: 0 3px 16px var(--color-shadow-header);
    padding: 12px 24px 16px 14px;
  }
  .t-title { font-family: var(--font-heading); font-weight: 700; font-size: 24px; line-height: 29px; color: var(--color-fg); }

  .tabs-bar { display: flex; align-items: flex-end; margin: 22px 39px 0 39px; border-bottom: 1px solid #1C1C1C33; }
  .tabs-bar .tt { height: 38px; display: flex; align-items: center; padding: 0 14px; cursor: pointer; font-family: var(--font-body); font-weight: 400; font-size: 16px; line-height: 19px; color: var(--color-fg-alt); position: relative; }
  .tabs-bar .tt.active { font-family: var(--font-heading); font-weight: 700; color: var(--color-fg); }
  .tabs-bar .tt.active::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px; width: 51px; background: var(--color-fg); }

  .appt-list { margin: 4px 39px 0 39px; }
  .appt-row { display: flex; align-items: center; height: 57px; border-bottom: 1px solid #1C1C1C33; }
  .appt-date { width: 76px; font-family: var(--font-body); font-weight: 400; font-size: 12px; line-height: 22px; color: #1C1C1C66; }
  .appt-title { flex: 1; font-family: var(--font-heading); font-weight: 700; font-size: 14px; line-height: 17px; color: var(--color-fg-alt); }
  .appt-actions { display: flex; align-items: center; gap: 12px; }
  .appt-modify { font-family: var(--font-heading); font-weight: 700; font-size: 14px; line-height: 17px; color: var(--color-fg); }
</style>
</head>
<body>
<div class="screen" data-od-id="time-screen">
  <div class="statusbar">
    <span class="sb-time">9:41</span>
    <span class="sb-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.6"/><rect x="4.6" y="5" width="3" height="6" rx="0.6"/><rect x="9.2" y="2.5" width="3" height="8.5" rx="0.6"/><rect x="13.8" y="0" width="3" height="11" rx="0.6"/></svg>
      <svg width="25" height="11" viewBox="0 0 25 11" fill="none"><rect x="0.5" y="0.5" width="21" height="10" rx="2.6" stroke="currentColor" opacity="0.45"/><rect x="2" y="2" width="16" height="7" rx="1.3" fill="currentColor"/><path d="M22.6 3.4v4.2a1.8 1.8 0 0 0 0-4.2Z" fill="currentColor"/></svg>
    </span>
  </div>

  <header class="t-head" data-od-id="time-header">
    <a class="icon-back" href="dashboard.html" aria-label="Back" data-od-id="time-back">
      <svg viewBox="0 0 11 18" fill="none"><path d="M9.5 1L2 9l7.5 8" stroke="#181461" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="t-title">March 2026</div>
  </header>

  <div class="scroll no-tab">
    <div class="tabs-bar" data-od-id="time-tabs">
      <div class="tt active" data-od-id="time-tab-upcoming">Upcoming</div>
      <div class="tt" data-od-id="time-tab-past">Past</div>
    </div>

    <div class="appt-list" data-od-id="time-appt-list">
      <div class="appt-row" data-od-id="appt-meeting">
        <div class="appt-date">14 Mar &middot; 09:30</div>
        <div class="appt-title">Team meeting</div>
        <div class="appt-actions">
          <span class="appt-modify">Modify</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="2"><path d="M4 20l4-1 11-11a2 2 0 0 0-3-3L5 16l-1 4Z"/></svg>
        </div>
      </div>
      <div class="appt-row" data-od-id="appt-lunch">
        <div class="appt-date">14 Mar &middot; 13:00</div>
        <div class="appt-title">Lunch with client</div>
        <div class="appt-actions">
          <span class="appt-modify">Modify</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="2"><path d="M4 20l4-1 11-11a2 2 0 0 0-3-3L5 16l-1 4Z"/></svg>
        </div>
      </div>
      <div class="appt-row" data-od-id="appt-dentist">
        <div class="appt-date">15 Mar &middot; 10:00</div>
        <div class="appt-title">Dentist</div>
        <div class="appt-actions">
          <span class="appt-modify">Modify</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="2"><path d="M4 20l4-1 11-11a2 2 0 0 0-3-3L5 16l-1 4Z"/></svg>
        </div>
      </div>
      <div class="appt-row" data-od-id="appt-gym">
        <div class="appt-date">16 Mar &middot; 15:30</div>
        <div class="appt-title">Gym</div>
        <div class="appt-actions">
          <span class="appt-modify">Modify</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="2"><path d="M4 20l4-1 11-11a2 2 0 0 0-3-3L5 16l-1 4Z"/></svg>
        </div>
      </div>
    </div>
  </div>

  <nav class="tabbar" data-od-id="tabbar">
    <div class="tabs-side">
      <a class="tab" href="dashboard.html" data-od-id="tab-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V21h14V9.5"/></svg>
        <span>Home</span>
      </a>
      <a class="tab" href="money.html" data-od-id="tab-money">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.4"/><path d="M6 10.5v3M18 10.5v3"/></svg>
        <span>Money</span>
      </a>
    </div>
    <div class="fab-slot"></div>
    <div class="tabs-side">
      <a class="tab active" href="time.html" data-od-id="tab-time">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>Time</span>
      </a>
      <a class="tab" href="time.html" data-od-id="tab-today">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
        <span>Today</span>
      </a>
    </div>
    <a class="fab" href="money-add.html" aria-label="Add" data-od-id="fab">
      <svg viewBox="0 0 20 20" width="20" height="20"><path d="M10 0V20M0 10H20" stroke="#fff" stroke-width="3"/></svg>
    </a>
  </nav>
</div>
</body>
</html>
